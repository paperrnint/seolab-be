name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Generate JaCoCo Report
        run: ./gradlew jacocoTestReport

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: build/reports/tests/test/

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create application.yml for build
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.yml << EOF
          spring:
            application:
              name: seolab-be
            datasource:
              url: jdbc:mysql://${{ secrets.RDS_HOST }}:3306/seolab_schema?serverTimezone=Asia/Seoul
              username: ${{ secrets.RDS_USERNAME }}
              password: ${{ secrets.RDS_PASSWORD }}
              driver-class-name: com.mysql.cj.jdbc.Driver
            jpa:
              hibernate:
                ddl-auto: update
              properties:
                hibernate:
                  format_sql: false
                  show_sql: false
              database-platform: org.hibernate.dialect.MySQL8Dialect
            data:
              redis:
                host: localhost
                port: 6379
                timeout: 2000ms
            mail:
              host: smtp.gmail.com
              port: 587
              username: ${{ secrets.EMAIL_USERNAME }}
              password: ${{ secrets.EMAIL_PASSWORD }}
              properties:
                mail:
                  smtp:
                    auth: true
                    starttls:
                      enable: true
                      required: true
                  mime:
                    charset: UTF-8
          jwt:
            secret: ${{ secrets.JWT_SECRET }}
            access-token-validity: 900000
            refresh-token-validity: 604800000
          kakao:
            api:
              key: ${{ secrets.KAKAO_API_KEY }}
              book-search-url: https://dapi.kakao.com/v3/search/book
          email:
            verification:
              expiration: 300
              code-length: 6
          server:
            port: 8080
          management:
            endpoints:
              web:
                exposure:
                  include: health
                base-path: /actuator
            endpoint:
              health:
                show-details: always
          logging:
            level:
              root: INFO
              com.example.seolab: INFO
          EOF

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Get JAR filename
        id: jar
        run: |
          JAR_FILE=$(ls build/libs/*.jar | grep -v 'plain' | head -n 1)
          echo "file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename $JAR_FILE)" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # 애플리케이션 디렉토리 생성
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} '
            mkdir -p ~/app
          '
          
          # JAR 파일 전송
          scp -o StrictHostKeyChecking=no -i private_key.pem \
            ${{ steps.jar.outputs.file }} \
            ${USER}@${HOST}:~/app/application.jar
          
          # EC2에서 application-prod.yml 생성 및 애플리케이션 재시작
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} "
            # application-prod.yml 생성
            cat > ~/app/application-prod.yml << 'EOFPROD'
          spring:
            application:
              name: seolab-be
            datasource:
              url: jdbc:mysql://${{ secrets.RDS_HOST }}:3306/seolab_schema?serverTimezone=Asia/Seoul
              username: ${{ secrets.RDS_USERNAME }}
              password: ${{ secrets.RDS_PASSWORD }}
              driver-class-name: com.mysql.cj.jdbc.Driver
            jpa:
              hibernate:
                ddl-auto: update
              properties:
                hibernate:
                  format_sql: false
                  show_sql: false
              database-platform: org.hibernate.dialect.MySQL8Dialect
            data:
              redis:
                host: localhost
                port: 6379
                timeout: 2000ms
            mail:
              host: smtp.gmail.com
              port: 587
              username: ${{ secrets.EMAIL_USERNAME }}
              password: ${{ secrets.EMAIL_PASSWORD }}
              properties:
                mail:
                  smtp:
                    auth: true
                    starttls:
                      enable: true
                      required: true
                  mime:
                    charset: UTF-8
          jwt:
            secret: ${{ secrets.JWT_SECRET }}
            access-token-validity: 900000
            refresh-token-validity: 604800000
          kakao:
            api:
              key: ${{ secrets.KAKAO_API_KEY }}
              book-search-url: https://dapi.kakao.com/v3/search/book
          email:
            verification:
              expiration: 300
              code-length: 6
          server:
            port: 8080
          management:
            endpoints:
              web:
                exposure:
                  include: health
                base-path: /actuator
            endpoint:
              health:
                show-details: always
          logging:
            level:
              root: INFO
              com.example.seolab: INFO
          EOFPROD
          
            # 애플리케이션 재시작
            sudo systemctl restart seolab
          
            # 시작 대기
            echo '⏳ Waiting for application to start...'
            sleep 10
          
            # 헬스 체크
            if sudo systemctl is-active --quiet seolab; then
              echo '✅ Application started successfully'
              sudo systemctl status seolab --no-pager
          
              # Actuator 헬스 체크
              echo '🏥 Checking health endpoint...'
              for i in {1..30}; do
                if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
                  echo '✅ Health check passed!'
                  curl -s http://localhost:8080/actuator/health | jq '.'
                  exit 0
                fi
                echo \"Attempt \$i/30: Waiting for health endpoint...\"
                sleep 2
              done
          
              echo '⚠️ Health endpoint not responding, but service is running'
              exit 0
            else
              echo '❌ Failed to start application'
              echo '📋 Last 100 lines of logs:'
              sudo journalctl -u seolab -n 100 --no-pager
              exit 1
            fi
          "
          
          rm -f private_key.pem

      - name: Deployment Status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
            echo "🚀 Application is running at http://${{ secrets.EC2_HOST }}:8080"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
