name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Generate JaCoCo Report
        run: ./gradlew jacocoTestReport

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Get current time
        uses: josStorer/get-current-time@v2
        id: current-time
        with:
          format: YYYY-MM-DD-HH-mm-ss
          utcOffset: "+09:00"

      - name: Copy jar to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            
            # 기존 애플리케이션 종료
            if pgrep -f 'dotori' > /dev/null; then
              echo "🛑 Stopping existing application..."
              pkill -f 'dotori'
              sleep 5
            fi
            
            # application-prod.yml 생성
            echo "📝 Creating application-prod.yml..."
            cat > application-prod.yml << 'EOF'
            spring:
              application:
                name: dotori-be
              datasource:
                url: jdbc:mysql://${{ secrets.RDS_HOST }}:3306/dotori_schema?serverTimezone=Asia/Seoul
                username: ${{ secrets.RDS_USERNAME }}
                password: ${{ secrets.RDS_PASSWORD }}
                driver-class-name: com.mysql.cj.jdbc.Driver
              jpa:
                hibernate:
                  ddl-auto: update
                properties:
                  hibernate:
                    format_sql: false
                    show_sql: false
                database-platform: org.hibernate.dialect.MySQL8Dialect
              data:
                redis:
                  host: localhost
                  port: 6379
              mail:
                host: smtp.gmail.com
                port: 587
                username: ${{ secrets.EMAIL_USERNAME }}
                password: ${{ secrets.EMAIL_PASSWORD }}
                properties:
                  mail:
                    smtp:
                      auth: true
                      starttls:
                        enable: true
                        required: true
            jwt:
              secret: ${{ secrets.JWT_SECRET }}
              access-token-validity: 900000
              refresh-token-validity: 604800000
            kakao:
              api:
                key: ${{ secrets.KAKAO_API_KEY }}
                book-search-url: https://dapi.kakao.com/v3/search/book
            email:
              verification:
                expiration: 300
                code-length: 6
            server:
              port: 8080
            management:
              endpoints:
                web:
                  exposure:
                    include: health
              endpoint:
                health:
                  show-details: when-authorized
            logging:
              level:
                root: INFO
                com.example.dotori: INFO
            EOF
            
            # 애플리케이션 시작
            echo "🚀 Starting application..."
            nohup java -jar \
              -Xms256m -Xmx512m \
              -Dspring.config.location=file:./application-prod.yml \
              -Dspring.profiles.active=prod \
              *.jar > app.log 2>&1 &
            
            echo "⏳ Waiting for application to start..."
            sleep 15
            
            # 헬스 체크
            for i in {1..20}; do
              if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ Application is healthy!"
                echo "📊 Application status:"
                curl -s http://localhost:8080/actuator/health
                exit 0
              fi
              echo "⏳ Waiting... ($i/20)"
              sleep 3
            done
            
            # 헬스 체크 실패 시
            echo "❌ Application failed to start"
            echo "📋 Last 50 lines of log:"
            tail -n 50 app.log
            exit 1
